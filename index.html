<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atrapa las Estrellas de Abel 🌟</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    @keyframes popUp {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4 font-sans relative">

  <!-- Elemento de Audio Nativo para la Música de Piano de Fondo -->
  <audio id="bgmAudio" loop preload="auto" src="https://upload.wikimedia.org/wikipedia/commons/e/e4/Gymnop%C3%A9die_No._1_%28Kevin_MacLeod%29.ogg"></audio>

  <!-- Mensaje Flotante en Pantalla para los Nombres -->
  <div id="achievementPopup" class="absolute top-6 z-50 pointer-events-none hidden transition-opacity duration-300">
    <div class="bg-amber-500/90 border-2 border-amber-300 text-slate-950 font-black px-6 py-3 rounded-2xl shadow-xl shadow-amber-500/40 text-base sm:text-lg text-center backdrop-blur-md max-w-xs sm:max-w-sm">
      <span id="achievementText">¡Felicidades!</span>
    </div>
  </div>

  <!-- Contenedor Principal -->
  <div class="w-full max-w-md flex flex-col items-center gap-4">
    
    <!-- Encabezado con Toque Personal -->
    <div class="text-center">
      <h1 class="text-3xl font-bold text-amber-400 drop-shadow-md">🌟 Atrapa las Estrellas de Abel</h1>
      <p class="text-sm text-slate-300 mt-1">
        Mueve la cesta con el <span class="text-amber-300 font-semibold">mouse</span>, <span class="text-amber-300 font-semibold">pantalla táctil</span> o las <span class="text-amber-300 font-semibold">flechas (⬅️ ➡️)</span>.
      </p>
    </div>

    <!-- Panel de Marcador -->
    <div class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-3 flex justify-around items-center backdrop-blur-sm">
      <div class="text-center">
        <span class="text-xs uppercase text-slate-400 font-bold block">Puntos</span>
        <span id="score" class="text-2xl font-black text-amber-400">0</span>
      </div>
      <div class="h-8 w-px bg-slate-700"></div>
      <div class="text-center">
        <span class="text-xs uppercase text-slate-400 font-bold block">Récord</span>
        <span id="highScore" class="text-2xl font-black text-emerald-400">0</span>
      </div>
    </div>

    <!-- Lienzo del Juego -->
    <div class="relative w-full flex justify-center">
      <canvas id="gameCanvas" class="bg-slate-950 w-full max-w-[400px] h-[450px]"></canvas>

      <!-- Pantalla de Inicio / Game Over -->
      <div id="overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center gap-4 z-20">
        <div id="gameTitle" class="text-3xl font-extrabold text-amber-400">¡Juego de Abel! 🌟</div>
        <p id="gameInstructions" class="text-slate-200 text-sm max-w-xs">
          Atrapa las estrellas 🌟, evita las bombas 💣 y desbloquea los mensajes especiales con música de piano.
        </p>
        <button id="startBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 px-8 rounded-full text-lg shadow-lg shadow-amber-500/30 transition transform hover:scale-105 active:scale-95 cursor-pointer">
          ¡JUGAR AHORA!
        </button>
      </div>
    </div>

    <!-- Leyenda de Objetos -->
    <div class="flex gap-6 text-xs text-slate-400 bg-slate-800/40 px-4 py-2 rounded-lg border border-slate-800">
      <div class="flex items-center gap-1.5">
        <span class="text-base">🌟</span> +10 Puntos
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-base">💣</span> Fin del Juego
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const gameTitle = document.getElementById('gameTitle');
    const gameInstructions = document.getElementById('gameInstructions');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const achievementPopup = document.getElementById('achievementPopup');
    const achievementText = document.getElementById('achievementText');
    const bgmAudio = document.getElementById('bgmAudio');

    // --- EFECTOS DE SONIDO CORTOS (Web Audio API) ---
    let audioCtx = null;

    function initAudioContext() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}
    }

    const pianoNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

    function playShortNote(freq) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    function playMilestoneSound() {
      if (!audioCtx) return;
      setTimeout(() => playShortNote(523.25), 0);
      setTimeout(() => playShortNote(659.25), 100);
      setTimeout(() => playShortNote(783.99), 200);
      setTimeout(() => playShortNote(1046.50), 300);
    }

    function playBombSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    // --- GESTIÓN DE HITOS Y MENSAJES ---
    let milestonesReached = {
      100: false,
      200: false,
      300: false,
      400: false,
      500: false
    };

    function checkMilestones(currentScore) {
      let message = "";
      let hit = false;

      if (currentScore === 100 && !milestonesReached[100]) {
        milestonesReached[100] = true;
        message = "¡Felicidades Abel! Eres un genio 🌟";
        hit = true;
      } else if (currentScore === 200 && !milestonesReached[200]) {
        milestonesReached[200] = true;
        message = "¡Felicidades Natalia Huamán Mendoza, llegaste a 200 puntos! 🎉";
        hit = true;
      } else if (currentScore === 300 && !milestonesReached[300]) {
        milestonesReached[300] = true;
        message = "¡Felicidades Nery, llegaste a 300 puntos! ⭐";
        hit = true;
      } else if (currentScore === 400 && !milestonesReached[400]) {
        milestonesReached[400] = true;
        message = "¡Felicidades Luis Enrique, llegaste a 400 puntos! 🏆";
        hit = true;
      } else if (currentScore === 500 && !milestonesReached[500]) {
        milestonesReached[500] = true;
        message = "¡Felicidades Mari Yasmín, llegaste a 500 puntos! 👑";
        hit = true;
      }

      if (hit) {
        showAchievement(message);
        playMilestoneSound();
      }
    }

    let popupTimeout = null;
    function showAchievement(text) {
      if (popupTimeout) clearTimeout(popupTimeout);
      achievementText.textContent = text;
      achievementPopup.classList.remove('hidden');
      achievementPopup.classList.add('animate-pop');

      popupTimeout = setTimeout(() => {
        achievementPopup.classList.add('hidden');
        achievementPopup.classList.remove('animate-pop');
      }, 4500);
    }

    // --- CONFIGURACIÓN DEL CANVAS Y JUEGO ---
    function resizeCanvas() {
      canvas.width = 400;
      canvas.height = 450;
    }
    resizeCanvas();

    let isPlaying = false;
    let score = 0;
    let highScore = localStorage.getItem('star_catcher_highscore') || 0;
    highScoreEl.textContent = highScore;

    const player = {
      width: 70,
      height: 18,
      x: canvas.width / 2 - 35,
      y: canvas.height - 35,
      speed: 8
    };

    let items = [];
    let spawnTimer = 0;
    let spawnInterval = 45; 

    const keys = { right: false, left: false };

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    });

    function updatePlayerPosition(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const canvasX = (clientX - rect.left) * scaleX;
      player.x = canvasX - player.width / 2;
      
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
    }

    canvas.addEventListener('mousemove', (e) => {
      if (isPlaying) updatePlayerPosition(e.clientX);
    });

    canvas.addEventListener('touchmove', (e) => {
      if (isPlaying && e.touches.length > 0) {
        updatePlayerPosition(e.touches[0].clientX);
      }
    }, { passive: true });

    function spawnItem() {
      const isBomb = Math.random() < 0.25;
      items.push({
        x: Math.random() * (canvas.width - 30) + 15,
        y: -20,
        radius: 14,
        speed: 2.8 + Math.random() * 2 + (score / 100),
        type: isBomb ? 'bomb' : 'star'
      });
    }

    function startGame() {
      initAudioContext();
      
      // Reproducir música de fondo de manera segura con el clic del botón
      bgmAudio.currentTime = 0;
      bgmAudio.play().catch(err => console.log("Audio play blocked:", err));

      score = 0;
      items = [];
      spawnInterval = 45;
      milestonesReached = { 100: false, 200: false, 300: false, 400: false, 500: false };
      scoreEl.textContent = score;
      isPlaying = true;
      overlay.classList.add('hidden');
      requestAnimationFrame(gameLoop);
    }

    function gameOver() {
      isPlaying = false;
      bgmAudio.pause(); // Pausar la música al perder
      playBombSound();
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('star_catcher_highscore', highScore);
        highScoreEl.textContent = highScore;
      }

      gameTitle.textContent = "¡GAME OVER! 💥";
      gameTitle.className = "text-3xl font-extrabold text-red-500";
      gameInstructions.innerHTML = Puntaje final: <strong class="text-amber-400 text-xl">${score}</strong><br>¡Tocaste una bomba!;
      startBtn.textContent = "VOLVER A INTENTAR";
      overlay.classList.remove('hidden');
    }

    function gameLoop() {
      if (!isPlaying) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (keys.right && player.x + player.width < canvas.width) player.x += player.speed;
      if (keys.left && player.x > 0) player.x -= player.speed;

      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.width, player.height, 10);
      ctx.fill();

      ctx.strokeStyle = '#e0f2fe';
      ctx.lineWidth = 2;
      ctx.stroke();

      spawnTimer++;
      if (spawnTimer >= spawnInterval) {
        spawnItem();
        spawnTimer = 0;
        if (spawnInterval > 20) spawnInterval -= 0.2;
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed;

        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.type === 'star' ? '🌟' : '💣', item.x, item.y);

        if (
          item.y + item.radius >= player.y &&
          item.y - item.radius <= player.y + player.height &&
          item.x >= player.x &&
          item.x <= player.x + player.width
        ) {
          if (item.type === 'star') {
            score += 10;
            scoreEl.textContent = score;
            
            const noteIndex = Math.floor((score / 10) % pianoNotes.length);
            playShortNote(pianoNotes[noteIndex]);

            checkMilestones(score);

            items.splice(i, 1);
            continue;
          } else if (item.type === 'bomb') {
            gameOver();
            return;
          }
        }

        if (item.y - item.radius > canvas.height) {
          items.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
