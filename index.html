<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memoria Estelar de Abel 🌟</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      background-color: #030712;
    }
    .card {
      perspective: 1000px;
    }
    .card-inner {
      transition: transform 0.4s;
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
    }
    @keyframes popUp {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4 font-sans relative">

  <!-- Pantalla de Inicio / Menú (A prueba de fallos) -->
  <div id="startScreen" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 text-center gap-6">
    <h1 class="text-3xl sm:text-4xl font-black text-amber-400">✨ Memoria Estelar de Abel ✨</h1>
    <p class="text-slate-300 text-sm max-w-sm leading-relaxed">
      Encuentra las parejas de cartas ocultas. Al completarlo, desbloquearás los mensajes especiales dedicados a <strong class="text-amber-300">Natalia</strong>, <strong class="text-amber-300">Nery</strong>, <strong class="text-amber-300">Luis Enrique</strong> y <strong class="text-amber-300">Mari Yasmín</strong>.
    </p>
    <button onclick="iniciarJuego()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 px-8 rounded-full text-lg shadow-lg shadow-amber-500/30 transition transform hover:scale-105 active:scale-95 cursor-pointer">
      ¡JUGAR AHORA!
    </button>
  </div>

  <!-- Contenedor Principal del Juego -->
  <div class="w-full max-w-md flex flex-col items-center gap-4">
    
    <div class="text-center">
      <h1 class="text-2xl font-extrabold text-amber-400">🌟 Memoria de Abel</h1>
      <p id="statusMsg" class="text-xs text-slate-300 mt-1">Encuentra todas las parejas ocultas</p>
    </div>

    <!-- Panel de Intentos / Victorias -->
    <div class="w-full bg-slate-800/90 border border-slate-700 rounded-xl p-3 flex justify-around items-center shadow-lg">
      <div class="text-center">
        <span class="text-xs uppercase text-slate-400 font-bold block">Intentos</span>
        <span id="intentos" class="text-2xl font-black text-amber-400">0</span>
      </div>
      <div class="h-8 w-px bg-slate-700"></div>
      <div class="text-center">
        <span class="text-xs uppercase text-slate-400 font-bold block">Parejas</span>
        <span id="parejas" class="text-2xl font-black text-emerald-400">0 / 6</span>
      </div>
    </div>

    <!-- Tablero de Cartas (Grilla 4x3) -->
    <div id="gameBoard" class="grid grid-cols-3 gap-3 w-full max-w-[360px] aspect-[3/4] my-2">
      <!-- Las cartas se generan dinámicamente con JavaScript -->
    </div>

    <!-- Botón de Reinicio -->
    <button onclick="iniciarJuego()" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-600 font-bold py-2 px-6 rounded-full text-sm transition cursor-pointer">
      Reiniciar Partida
    </button>

  </div>

  <!-- Ventana Flotante de Mensajes Especiales -->
  <div id="modalMsg" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">
    <div class="bg-amber-400 border-2 border-amber-200 text-slate-950 font-black p-6 rounded-3xl shadow-2xl text-center max-w-sm animate-pop flex flex-col gap-4">
      <div id="modalTexto" class="text-lg">¡Felicidades!</div>
      <button onclick="cerrarModal()" class="bg-slate-950 text-amber-400 hover:bg-slate-900 py-2 px-6 rounded-full text-sm font-bold cursor-pointer">
        ¡Continuar!
      </button>
    </div>
  </div>

  <script>
    const emojis = ['🌟', '🎹', '🌙', '⭐', '🏆', '👑'];
    let cartas = [];
    let primeraCarta = null;
    let segundaCarta = null;
    let bloqueoTablero = false;
    let intentos = 0;
    let parejasEncontradas = 0;

    const startScreen = document.getElementById('startScreen');
    const gameBoard = document.getElementById('gameBoard');
    const intentosEl = document.getElementById('intentos');
    const parejasEl = document.getElementById('parejas');
    const modalMsg = document.getElementById('modalMsg');
    const modalTexto = document.getElementById('modalTexto');
    const statusMsg = document.getElementById('statusMsg');

    function iniciarJuego() {
      startScreen.style.display = 'none';
      modalMsg.classList.add('hidden');
      intentos = 0;
      parejasEncontradas = 0;
      intentosEl.textContent = intentos;
      parejasEl.textContent = `${parejasEncontradas} / 6`;
      statusMsg.textContent = "¡Encuentra todas las parejas!";

      // Duplicar emojis para hacer pares y barajarlos
      cartas = [...emojis, ...emojis]
        .sort(() => Math.random() - 0.5)
        .map((emoji, index) => ({ id: index, emoji, volteada: false, encontrada: false }));

      renderizarTablero();
    }

    function renderizarTablero() {
      gameBoard.innerHTML = '';
      cartas.forEach((carta, index) => {
        const cardElement = document.createElement('div');
        cardElement.className = `card w-full h-full cursor-pointer ${carta.volteada || carta.encontrada ? 'flipped' : ''}`;
        cardElement.innerHTML = `
          <div class="card-inner relative w-full h-full rounded-xl shadow-md">
            <div class="card-front absolute inset-0 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center text-2xl hover:bg-slate-700 transition">
              ❓
            </div>
            <div class="card-back absolute inset-0 bg-slate-900 border-2 border-amber-400 rounded-xl flex items-center justify-center text-3xl">
              ${carta.emoji}
            </div>
          </div>
        `;
        cardElement.addEventListener('click', () => voltearCarta(index));
        gameBoard.appendChild(cardElement);
      });
    }

    function voltearCarta(index) {
      if (bloqueoTablero) return;
      let cartaSeleccionada = cartas[index];

      if (cartaSeleccionada.volteada || cartaSeleccionada.encontrada) return;

      cartaSeleccionada.volteada = true;
      renderizarTablero();

      if (!primeraCarta) {
        primeraCarta = { index, emoji: cartaSeleccionada.emoji };
      } else {
        segundaCarta = { index, emoji: cartaSeleccionada.emoji };
        verificarPareja();
      }
    }

    function verificarPareja() {
      intentos++;
      intentosEl.textContent = intentos;

      if (primeraCarta.emoji === segundaCarta.emoji) {
        cartas[primeraCarta.index].encontrada = true;
        cartas[segundaCarta.index].encontrada = true;
        parejasEncontradas++;
        parejasEl.textContent = `${parejasEncontradas} / 6`;

        reiniciarSeleccion();

        // Disparar mensajes especiales progresivos
        if (parejasEncontradas === 1) {
          mostrarMensaje("¡Felicidades Abel! Eres un genio 🌟");
        } else if (parejasEncontradas === 2) {
          mostrarMensaje("¡Felicidades Natalia Huamán Mendoza, vas excelente! 🎉");
        } else if (parejasEncontradas === 3) {
          mostrarMensaje("¡Felicidades Nery, mitad del camino lograda! ⭐");
        } else if (parejasEncontradas === 4) {
          mostrarMensaje("¡Felicidades Luis Enrique, gran concentración! 🏆");
        } else if (parejasEncontradas === 5) {
          mostrarMensaje("¡Felicidades Mari Yasmín, a un paso de la gloria! 👑");
        } else if (parejasEncontradas === 6) {
          statusMsg.textContent = "¡Juego completado con éxito! 🎉";
          setTimeout(() => {
            mostrarMensaje("🏆 ¡Increíble! Has ganado la partida y completado todos los honores.");
          }, 400);
        }

      } else {
        bloqueoTablero = true;
        setTimeout(() => {
          cartas[primeraCarta.index].volteada = false;
          cartas[segundaCarta.index].volteada = false;
          reiniciarSeleccion();
          renderizarTablero();
        }, 800);
      }
    }

    function reiniciarSeleccion() {
      primeraCarta = null;
      segundaCarta = null;
      bloqueoTablero = false;
    }

    function mostrarMensaje(texto) {
      modalTexto.textContent = texto;
      modalMsg.classList.remove('hidden');
    }

    function cerrarModal() {
      modalMsg.classList.add('hidden');
    }
  </script>
</body>
</html>
