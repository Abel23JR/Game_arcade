<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atrapa las Estrellas 🌟</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      touch-action: none;
      user-select: none;
    }
    canvas {
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4 font-sans">

  <!-- Contenedor Principal -->
  <div class="w-full max-w-md flex flex-col items-center gap-4">
    
    <!-- Encabezado con Instrucciones -->
    <div class="text-center">
      <h1 class="text-3xl font-bold text-amber-400 drop-shadow-md">🌟 Atrapa las Estrellas</h1>
      <p class="text-sm text-slate-300 mt-1">
        Mueve la cesta con el <span class="text-amber-300 font-semibold">mouse</span>, <span class="text-amber-300 font-semibold">pantalla táctil</span> o las <span class="text-amber-300 font-semibold">flechas (⬅️ ➡️)</span>.
      </p>
    </div>

    <!-- Panel de Marcador -->
    <div class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-3 flex justify-around items-center backdrop-blur-sm">
      <div class="text-center">
        <span class="text-xs uppercase text-slate-400 font-bold block">Puntos</span>
        <span id="score" class="text-2xl font-black text-amber-400">0</span>
      </div>
      <div class="h-8 w-px bg-slate-700"></div>
      <div class="text-center">
        <span class="text-xs uppercase text-slate-400 font-bold block">Récord</span>
        <span id="highScore" class="text-2xl font-black text-emerald-400">0</span>
      </div>
    </div>

    <!-- Lienzo del Juego -->
    <div class="relative w-full flex justify-center">
      <canvas id="gameCanvas" class="bg-slate-950 w-full max-w-[400px] h-[450px]"></canvas>

      <!-- Pantalla de Inicio / Game Over -->
      <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-6 text-center gap-4">
        <div id="gameTitle" class="text-3xl font-extrabold text-amber-400">¡Listo para jugar!</div>
        <p id="gameInstructions" class="text-slate-200 text-sm max-w-xs">
          Atrapa todas las <strong class="text-amber-300">estrellas 🌟</strong> que puedas y evita las <strong class="text-red-400">bombas 💣</strong>.
        </p>
        <button id="startBtn" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 px-8 rounded-full text-lg shadow-lg shadow-amber-500/30 transition transform hover:scale-105 active:scale-95">
          ¡JUGAR AHORA!
        </button>
      </div>
    </div>

    <!-- Leyenda de Objetos -->
    <div class="flex gap-6 text-xs text-slate-400 bg-slate-800/40 px-4 py-2 rounded-lg border border-slate-800">
      <div class="flex items-center gap-1.5">
        <span class="text-base">🌟</span> +10 Puntos
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-base">💣</span> Fin del Juego
      </div>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const gameTitle = document.getElementById('gameTitle');
    const gameInstructions = document.getElementById('gameInstructions');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');

    // Ajustar dimensiones internas del canvas
    function resizeCanvas() {
      canvas.width = 400;
      canvas.height = 450;
    }
    resizeCanvas();

    // Estado del Juego
    let isPlaying = false;
    let score = 0;
    let highScore = localStorage.getItem('star_catcher_highscore') || 0;
    highScoreEl.textContent = highScore;

    // Configuración de la Cesta (Jugador)
    const player = {
      width: 70,
      height: 18,
      x: canvas.width / 2 - 35,
      y: canvas.height - 35,
      speed: 7,
      dx: 0
    };

    // Colecciones de Objetos
    let items = [];
    let spawnTimer = 0;
    let spawnInterval = 45; // Frecuencia con la que caen los objetos

    // Teclado
    const keys = { right: false, left: false };

    // Eventos de Controles
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    });

    // Control con Mouse / Pantalla Táctil
    function updatePlayerPosition(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const canvasX = (clientX - rect.left) * scaleX;
      player.x = canvasX - player.width / 2;
      
      // Mantener dentro del canvas
      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
    }

    canvas.addEventListener('mousemove', (e) => {
      if (isPlaying) updatePlayerPosition(e.clientX);
    });

    canvas.addEventListener('touchmove', (e) => {
      if (isPlaying && e.touches.length > 0) {
        updatePlayerPosition(e.touches[0].clientX);
      }
    });

    // Generar Estrellas o Bombas
    function spawnItem() {
      const isBomb = Math.random() < 0.25; // 25% de probabilidad de ser bomba
      items.push({
        x: Math.random() * (canvas.width - 30) + 15,
        y: -20,
        radius: 14,
        speed: 2.5 + Math.random() * 2 + (score / 100), // Aumenta velocidad con el puntaje
        type: isBomb ? 'bomb' : 'star'
      });
    }

    // Iniciar Juego
    function startGame() {
      score = 0;
      items = [];
      spawnInterval = 45;
      scoreEl.textContent = score;
      isPlaying = true;
      overlay.classList.add('hidden');
      requestAnimationFrame(gameLoop);
    }

    // Game Over
    function gameOver() {
      isPlaying = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('star_catcher_highscore', highScore);
        highScoreEl.textContent = highScore;
      }

      gameTitle.textContent = "¡GAME OVER! 💥";
      gameTitle.className = "text-3xl font-extrabold text-red-500";
      gameInstructions.innerHTML = `Puntaje final: <strong class="text-amber-400 text-xl">${score}</strong><br>¡Tocaste una bomba!`;
      startBtn.textContent = "VOLVER A INTENTAR";
      overlay.classList.remove('hidden');
    }

    // Bucle Principal del Juego
    function gameLoop() {
      if (!isPlaying) return;

      // Limpiar Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dibujar Fondo Estrellado Sencillo
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Movimiento con teclado
      if (keys.right && player.x + player.width < canvas.width) player.x += player.speed;
      if (keys.left && player.x > 0) player.x -= player.speed;

      // Dibujar Jugador (Cesta)
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.width, player.height, 10);
      ctx.fill();

      // Borde de la Cesta
      ctx.strokeStyle = '#e0f2fe';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Generar Objetos
      spawnTimer++;
      if (spawnTimer >= spawnInterval) {
        spawnItem();
        spawnTimer = 0;
        // Aumentar dificultad poco a poco
        if (spawnInterval > 20) spawnInterval -= 0.2;
      }

      // Actualizar y Dibujar Objetos
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed;

        // Dibujar Objeto
        ctx.font = '22px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(item.type === 'star' ? '🌟' : '💣', item.x, item.y);

        // Detectar Colisión con la Cesta
        if (
          item.y + item.radius >= player.y &&
          item.y - item.radius <= player.y + player.height &&
          item.x >= player.x &&
          item.x <= player.x + player.width
        ) {
          if (item.type === 'star') {
            score += 10;
            scoreEl.textContent = score;
            items.splice(i, 1);
            continue;
          } else if (item.type === 'bomb') {
            gameOver();
            return;
          }
        }

        // Eliminar objetos que salgan de la pantalla
        if (item.y - item.radius > canvas.height) {
          items.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
